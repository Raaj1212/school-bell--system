<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Bell & Announcement System</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--line:#e3e7ec;--blue:#2563eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:#12213a;color:#fff;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
header h1{font-size:18px;margin:0;font-weight:600}
main{max-width:720px;margin:14px auto;padding:0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:15px}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
button.danger{color:var(--red);border-color:#f3c1c1}
button.mic-on{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
button.small{padding:5px 10px;font-size:13px}
input,select{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px}
input[type=text]{flex:1;min-width:120px}
#nextBell{font-size:17px;font-weight:700;color:var(--green)}
.item{border:1px solid var(--line);border-radius:10px;padding:9px;margin:8px 0}
.r1{display:flex;gap:8px;align-items:center}
.r3{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.days label{margin-right:6px;font-size:13px}
.hint{font-size:13px;color:#6b7280;margin:6px 0}
.muted{color:#6b7280;font-size:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12213a;color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90vw}
</style>
</head>
<body>
<header><h1>School Bell & Announcement</h1><span id="runState">चालू है</span><span id="nextBell"></span></header>
<main>

<section class="card">
  <h2>ऑटो घंटी सिस्टम (सर्वर मोड)</h2>
  <div class="row">
    <button onclick="testBellGeneral()">घंटी टेस्ट करें</button>
    <button onclick="stopSound()">रोकें</button>
  </div>
  <div class="hint">सिस्टम पूरी तरह ऑटोमैटिक मोड में है (घंटी + टेक्स्ट TTS समर्थित)।</div>
</section>

<section class="card">
  <h2>लाइव अनाउंसमेंट (माइक से सीधे बोलें)</h2>
  <div class="row">
    <button id="micBtn" onclick="toggleMic()">लाइव माइक चालू करें</button>
    <span id="micState" class="muted">माइक बंद है</span>
  </div>
</section>

<section class="card">
  <h2>गैप सेटिंग्स (घंटी के बाद बोलने का समय)</h2>
  <div class="row">
    <span class="muted">गैप चुनें:</span>
    <select id="delaySelect" onchange="updateDelay(this)">
      <option value="100">तुरंत (0.1 सेकंड)</option>
      <option value="300" selected>सामान्य (0.3 सेकंड)</option>
      <option value="600">थोड़ा रुककर (0.6 सेकंड)</option>
      <option value="1000">1 सेकंड</option>
    </select>
  </div>
</section>

<section class="card">
  <h2>टाइमटेबल & टेक्स्ट घोषणा (हर पीरियड के लिए टेक्स्ट)</h2>
  <div class="row days" id="daysRow"></div>
  <div id="items"></div>
  <div class="row"><button onclick="addItem()">+ नया पीरियड/घंटी जोड़ें</button></div>
</section>

</main>
<div id="toast"></div>
<script>
"use strict";
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DNAMES={"Mon":"सोम","Tue":"मंगल","Wed":"बुध","Thu":"गुरु","Fri":"शुक्र","Sat":"शनि","Sun":"रवि"};

let st=JSON.parse(localStorage.getItem("bellphone")||"null")||{
  items:[{time:"08:00",label:"Assembly",bell:true,sayText:"प्रार्थना का समय हो गया है"}],
  days:"all",bellDelay:300
};
st.bellDelay = st.bellDelay || 300;

let running=false, audioEl=new Audio(), quietEl=null;
let mediaStream=null, audioCtx=null, micSource=null;

const DEFAULT_BELL_URL = "https://raw.githubusercontent.com/Raaj1212/school-bell--system/e347b833a12976f21f67b2e1eec35a1052a97cd9/bell.mp3.mpeg"; 
audioEl.src = DEFAULT_BELL_URL;

function updateDelay(sel){
  st.bellDelay = parseInt(sel.value);
  save();
  toast("गैप बदल गया: "+sel.options[sel.selectedIndex].text);
}

function makeQuietLoop(){
  try{
    const sr=8000,sec=2,n=sr*sec,buf=new Uint8Array(44+n*2),dv=new DataView(buf.buffer);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
    w(0,"RIFF");dv.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,"data");dv.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){const v=Math.round(200*Math.sin(2*Math.PI*85*i/sr));dv.setInt16(44+i*2,v,true);}
    let out="";const CHUNK=8192;
    for(let i=0;i<buf.length;i+=CHUNK){out+=String.fromCharCode.apply(null,buf.subarray(i,Math.min(i+CHUNK,buf.length)));}
    quietEl=new Audio("data:audio/wav;base64,"+btoa(out));
    quietEl.loop=true;quietEl.volume=0.05;
  }catch(e){}
}
const dstr=()=>new Date().toDateString();
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",3000);}
function save(){localStorage.setItem("bellphone",JSON.stringify(st));}
function daysToArr(d){if(!d||d==="all")return [...DAYS];if(Array.isArray(d))return d.slice();d=String(d);if(d.includes("-")){const [a,b]=d.split("-");let i=DAYS.indexOf(a.slice(0,3)),j=DAYS.indexOf(b.slice(0,3));return DAYS.slice(Math.min(i,j),Math.max(i,j)+1);}return d.split(",").map(x=>x.trim());}
function arrToDays(a){return a.length===7?"all":a.join(",");}

// ब्राउज़र TTS (इंडियन फीमेल वॉइस के साथ)
function speak(text){
  if(!text)return;
  try{
    window.speechSynthesis.cancel();
    let u = new SpeechSynthesisUtterance(text);
    u.lang = "hi-IN";
    u.rate = 0.95;
    
    let voices = window.speechSynthesis.getVoices();
    let hiVoice = voices.find(v => /hi|India|female|Google/i.test(v.lang) || /female|heera|kalpana|swara/i.test(v.name));
    if(hiVoice) u.voice = hiVoice;
    
    window.speechSynthesis.speak(u);
  }catch(e){console.log("TTS error", e);}
}

// घंटी बजाने के बाद गैप देकर टेक्स्ट बोलने का पक्का सीक्वेंस
function ringAndSpeak(text, playBell, cb){
  if(playBell === false){
    speak(text);
    if(cb) cb();
    return;
  }
  
  audioEl.pause();
  audioEl.currentTime = 0;
  
  audioEl.onended = () => {
    audioEl.onended = null;
    setTimeout(() => {
      if(text) speak(text);
      if(cb) cb();
    }, st.bellDelay || 300);
  };
  
  audioEl.play().catch(() => {
    if(text) speak(text);
    if(cb) cb();
  });
}

function testBellGeneral(){
  ringAndSpeak("यह टेस्ट घोषणा है", true, null);
}

function stopSound(){
  try{ window.speechSynthesis.cancel(); }catch(e){}
  audioEl.pause();
  audioEl.currentTime = 0;
}

async function toggleMic(){
  const btn=document.getElementById("micBtn");
  const state=document.getElementById("micState");
  if(mediaStream){
    mediaStream.getTracks().forEach(track=>track.stop());
    mediaStream=null;
    if(audioCtx)audioCtx.close();
    audioCtx=null;
    btn.textContent="लाइव माइक चालू करें";
    btn.className="";
    state.textContent="माइक बंद है";
    toast("लाइव माइक बंद कर दिया गया");
    return;
  }
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    micSource=audioCtx.createMediaStreamSource(mediaStream);
    micSource.connect(audioCtx.destination);
    btn.textContent="माइक बंद करें";
    btn.className="mic-on";
    state.textContent="लाइव माइक चालू है";
    toast("लाइव माइक चालू हो गया");
  }catch(e){
    toast("माइक की अनुमति नहीं मिली");
  }
}

function startSys(){
  if(running)return;running=true;
  document.getElementById("runState").textContent="चालू है";
  try{if(!quietEl)makeQuietLoop();quietEl.currentTime=0;quietEl.play();}catch(e){}
}

function hhmm(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function tick(){
  const d=new Date();
  if(running&&d.getSeconds()<3){
    const t=hhmm(d),today=dstr();
    const log=JSON.parse(localStorage.getItem("bellfired")||"{}");
    if(log.date!==today){localStorage.setItem("bellfired",JSON.stringify({date:today,list:{}}));}
    const cur=JSON.parse(localStorage.getItem("bellfired")||"{}");
    if(cur.date===today&&cur.list[t])return;
    const days=daysToArr(st.days);
    if(!days.includes(DAYS[d.getDay()]))return;
    const hits=st.items.filter(i=>i.time===t);
    if(hits.length){
      cur.list[t]=true;localStorage.setItem("bellfired",JSON.stringify(cur));
      hits.sort((a,b)=>String(a.label).localeCompare(String(b.label)));
      
      hits.forEach(i=>{
        ringAndSpeak(i.sayText, i.bell!==false, null);
      });
      showNext();
    }
  }
  showNext();
}

function showNext(){
  const d=new Date();const now=hhmm(d);
  const days=daysToArr(st.days);
  const ok=days.includes(DAYS[d.getDay()]);
  const items=[...st.items].sort((a,b)=>a.time.localeCompare(b.time));
  let nxt=null;
  if(ok){for(const i of items){if(i.time>now){nxt=i;break;}}}
  document.getElementById("nextBell").textContent=nxt?("अगली: "+nxt.time+" "+(nxt.label||"")):"आज की सब हो गईं";
}

function render(){
  const dr=document.getElementById("daysRow");dr.innerHTML="";
  const days=daysToArr(st.days);
  DAYS.forEach(dd=>{const l=document.createElement("label");l.className="chk";const c=document.createElement("input");c.type="checkbox";c.checked=days.includes(dd);c.onchange=()=>{st.days=arrToDays(DAYS.filter(x=>dr.querySelectorAll("input")[DAYS.indexOf(x)].checked));save();showNext();};l.append(c,document.createTextNode(DNAMES[dd]));dr.appendChild(l);});
  const box=document.getElementById("items");box.innerHTML="";
  st.items.forEach(it=>{if(!it.id)it.id="b"+Math.random().toString(36).slice(2,9);});save();
  [...st.items].sort((a,b)=>a.time.localeCompare(b.time)).forEach(it=>{
    const r=document.createElement("div");r.className="item";
    
    // पहली लाइन: समय और नाम
    const r1=document.createElement("div");r1.className="r1";
    const t=document.createElement("input");t.type="time";t.value=it.time||"08:00";t.style.width="110px";t.oninput=()=>{it.time=t.value;save();showNext();};
    const lblInput=document.createElement("input");lblInput.type="text";lblInput.value=it.label||"";lblInput.placeholder="पीरियड का नाम (जैसे: First Period)";lblInput.style.flex="1";lblInput.oninput=()=>{it.label=lblInput.value;save();showNext();};
    const del=document.createElement("button");del.className="danger small";del.textContent="✕";
    del.onclick=()=>{st.items=st.items.filter(x=>x!==it);save();render();};
    r1.append(t,lblInput,del);

    // दूसरी लाइन: बोलने वाला टेक्स्ट बॉक्स (यहीं पर आप लिखकर सेव करेंगे और जब चाहें बदलेंगे)
    const r2=document.createElement("div");r2.className="row";r2.style.marginTop="6px";
    const sayInput = document.createElement("input");
    sayInput.type = "text";
    sayInput.value = it.sayText || "";
    sayInput.placeholder = "घंटी के बाद क्या बोलना है वो यहाँ लिखें (जैसे: प्रथम घंटी बज चुकी है)";
    sayInput.style.flex = "1";
    sayInput.oninput = () => {
      it.sayText = sayInput.value;
      save(); // ऑटोमैटिक सेव होता रहेगा
    };
    r2.append(sayInput);

    // तीसरी लाइन: घंटी का चेकबॉक्स और टेस्ट बटन
    const r3=document.createElement("div");r3.className="r3";
    const bc=document.createElement("input");bc.type="checkbox";bc.checked=it.bell!==false;bc.onchange=()=>{it.bell=bc.checked;save();};
    const bl=document.createElement("label");bl.append(bc,document.createTextNode("घंटी बजे"));

    const playBtn = document.createElement("button");
    playBtn.className = "small primary";
    playBtn.textContent = "▶ टेस्ट बजाकर सुनें";
    playBtn.onclick = () => {
      ringAndSpeak(it.sayText, it.bell!==false, null);
    };

    r3.append(bl, playBtn);
    r.append(r1, r2, r3); box.appendChild(r);
  });
  showNext();
}

function addItem(){st.items.push({time:"09:00",label:"",bell:true,sayText:""});save();render();}

loadSpeakOpts();
function loadSpeakOpts(){
  document.getElementById("delaySelect").value = String(st.bellDelay || 300);
}

render();
setInterval(tick,1000);

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    startSys();
  }, 1000);
});
</script>
</body>
</html>
